<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脸修复系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                        <circle cx="9" cy="10" r="1.5"/><circle cx="15" cy="10" r="1.5"/>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                    </svg>
                    <h1>人脸修复系统</h1>
                </div>
                <div class="status-badge" id="statusBadge">
                    <span class="status-dot"></span>
                    <span id="statusText">检查中...</span>
                </div>
            </div>
        </header>

        <main class="main-content">
            <!-- 左侧：上传区域 + 设置 -->
            <section class="upload-section">
                <div class="card">
                    <h2 class="card-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        上传图片
                    </h2>
                    <div class="upload-zone" id="uploadZone">
                        <input type="file" id="fileInput" accept="image/*" multiple hidden>
                        <div class="upload-content">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                            </svg>
                            <p class="upload-text">拖拽图片到此处，或点击选择</p>
                            <p class="upload-hint">支持 JPG / PNG / BMP / WebP，最大 16MB</p>
                        </div>
                    </div>

                    <!-- 预览已选择的文件 -->
                    <div class="file-list" id="fileList"></div>
                </div>

                <!-- 设置面板 -->
                <div class="card">
                    <h2 class="card-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                        增强设置
                    </h2>
                    <div class="settings-group">
                        <label class="toggle-label">
                            <span>超分辨率增强</span>
                            <label class="toggle">
                                <input type="checkbox" id="srEnable">
                                <span class="toggle-slider"></span>
                            </label>
                        </label>
                        <div class="sr-options" id="srOptions" style="display:none">
                            <div class="setting-row">
                                <label>增强方法</label>
                                <select id="srMethod">
                                    <option value="bicubic">Bicubic 插值</option>
                                    <option value="srcnn">SRCNN 网络</option>
                                    <option value="espcn">ESPCN 网络</option>
                                    <option value="opencv">OpenCV 增强</option>
                                </select>
                            </div>
                            <div class="setting-row">
                                <label>放大倍数</label>
                                <select id="srScale">
                                    <option value="2" selected>2x</option>
                                    <option value="4">4x</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <button class="btn-primary" id="submitBtn" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                        </svg>
                        开始修复
                    </button>
                </div>
            </section>

            <!-- 右侧：结果展示 -->
            <section class="result-section" id="resultSection">
                <!-- 空状态 -->
                <div class="empty-state" id="emptyState">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3">
                        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <p>上传图片后，修复结果将显示在这里</p>
                </div>

                <!-- 加载状态 -->
                <div class="loading-state" id="loadingState" style="display:none">
                    <div class="spinner"></div>
                    <p id="loadingText">正在修复中...</p>
                </div>

                <!-- 结果列表 -->
                <div class="results-list" id="resultsList" style="display:none"></div>
            </section>
        </main>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
